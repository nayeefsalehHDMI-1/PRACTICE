<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShareBite - Community Food Saver</title>
    <!-- Favicon using image.png -->
    <link rel="icon" type="image/png" href="image.png">
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts for exact typography -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Header -->
    <header class="site-header">
        <div class="header-content">
            <div class="logo-area">
                <img src="image.png" alt="ShareBite Croissant Logo" class="logo-icon">
                <span class="logo-text">ShareBite</span>
            </div>
            <button class="donate-btn" id="openDonateModal">+ Donate Food</button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main-content">
        <section class="hero-section">
            <h1>Reduce Waste, Share Food</h1>
            <p>Connect with neighbours and local businesses to claim fresh surplus food for free.</p>
        </section>

        <!-- Search and Filter Bar -->
        <div class="filter-bar">
            <div class="search-wrapper">
                <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                <input type="text" id="searchInput" placeholder="Search items or locations...">
            </div>
            <div class="category-filters">
                <button class="filter-chip active" data-category="all">All</button>
                <button class="filter-chip" data-category="produce">Produce</button>
                <button class="filter-chip" data-category="bakery">Bakery</button>
                <button class="filter-chip" data-category="prepared">Prepared Meals</button>
            </div>
        </div>

        <!-- Items Grid -->
        <div class="items-grid" id="itemsGrid">
            <!-- Dynamic items will be injected here by app.js -->
        </div>
    </main>

    <!-- Footer -->
    <footer class="site-footer">
        <div class="footer-content">
            <p>&copy; 2026 ShareBite Reserved - Community Food Saver</p>
            <button id="resetStockBtn" class="reset-stock-btn">Reset All Stock</button>
        </div>
    </footer>

    <!-- Donate Food Modal -->
    <div class="modal-overlay" id="donateModal">
        <div class="modal">
            <h2>Donate Surplus Food</h2>
            <form id="donateForm">
                <div class="form-group">
                    <label>Item Name</label>
                    <input type="text" id="itemName" required placeholder="e.g. Fresh Croissants">
                </div>
                <div class="form-group">
                    <label>Category</label>
                    <select id="itemCategory" required>
                        <option value="bakery">Bakery</option>
                        <option value="produce">Produce</option>
                        <option value="prepared">Prepared Meals</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Location / Business</label>
                    <input type="text" id="itemLocation" required placeholder="e.g. Downtown Bakery">
                </div>
                <div class="form-group">
                    <label>Available Time</label>
                    <input type="text" id="itemTime" required placeholder="e.g. Today, 8 PM">
                </div>
                <div class="modal-actions">
                    <button type="button" class="cancel-btn" id="closeDonateModal">Cancel</button>
                    <button type="submit" class="submit-btn">List Item</button>
                </div>
            </form>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
