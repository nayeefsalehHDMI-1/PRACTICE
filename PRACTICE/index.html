<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShareBite - Food Saving Community</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="image.png">
</head>

<body class="bg-slate-900 font-sans text-gray-800 min-h-screen flex justify-center items-center sm:py-6 sm:px-4">

    <!-- Responsive App Container (Mobile: Fullscreen, Desktop/Laptop: Centered iPhone Mockup) -->
    <div class="iphone-frame">
        <!-- iPhone Notch & Status Bar (Visible on larger screens to preserve iPhone theme) -->
        <div class="iphone-status-bar">
            <span>9:41</span>
            <div class="iphone-notch"></div>
            <div class="flex items-center space-x-1.5 text-xs">
                <span>5G</span>
                <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M12 3c-4.97 0-9 4.03-9 9 0 2.12.74 4.07 1.97 5.61L4.35 19h4.31c1.03.62 2.25 1 3.34 1s2.31-.38 3.34-1h4.31l-1.62-1.39C20.26 16.07 21 14.12 21 12c0-4.97-4.03-9-9-9zm0 15c-3.31 0-6-2.69-6-6s2.69-6 6-6 6 2.69 6 6-2.69 6-6 6z"/></svg>
            </div>
        </div>

        <!-- App Screen Content -->
        <div class="iphone-screen">
            <!-- iOS Navigation Header -->
<header class="ios-header">
    <div class="flex items-center space-x-2">
        <img src="image.png" alt="ShareBite Logo" class="w-8 h-8 rounded-full object-cover shadow-sm">
        <h1 class="text-xl font-bold tracking-tight text-gray-900">ShareBite</h1>
    </div>
    <button onclick="toggleModal()" class="bg-emerald-600 text-white px-3.5 py-1.5 rounded-full text-xs font-semibold shadow-sm active:scale-95 transition">
        + Donate
    </button>
</header>

            <!-- Main Scrollable Area -->
            <main class="flex-grow overflow-y-auto px-4 py-3 space-y-4 pb-24">
                
                <!-- Hero Banner -->
                <div class="bg-gradient-to-br from-emerald-500 to-teal-600 text-white p-4 rounded-2xl shadow-sm">
                    <h2 class="text-lg font-bold">Reduce Waste, Share Food[cite: 3]</h2>
                    <p class="text-xs text-emerald-100 mt-1">Connect with neighbors and local businesses to claim fresh surplus food[cite: 3].</p>
                </div>

                <!-- Search & Filters -->
                <div class="space-y-2">
                    <input type="text" id="searchInput" oninput="filterFoodItems()" placeholder="Search items or locations..." class="w-full p-2.5 bg-gray-100 border-none rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
                    
                    <div class="flex gap-1.5 overflow-x-auto pb-1 no-scrollbar">
                        <button onclick="setFilter('all')" class="filter-btn active-btn px-3 py-1.5 rounded-full text-xs font-medium whitespace-nowrap">All</button>
                        <button onclick="setFilter('Produce')" class="filter-btn bg-gray-100 px-3 py-1.5 rounded-full text-xs font-medium whitespace-nowrap">Produce</button>
                        <button onclick="setFilter('Bakery')" class="filter-btn bg-gray-100 px-3 py-1.5 rounded-full text-xs font-medium whitespace-nowrap">Bakery</button>
                        <button onclick="setFilter('Prepared')" class="filter-btn bg-gray-100 px-3 py-1.5 rounded-full text-xs font-medium whitespace-nowrap">Prepared</button>
                    </div>
                </div>

                <!-- Food Listings Feed -->
                <div id="foodGrid" class="space-y-3">
                    <!-- Cards injected dynamically -->
                </div>
            </main>

            <!-- iOS Bottom Tab Bar -->
            <nav class="ios-tabbar">
                <a href="#" class="tab-item text-emerald-600">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
                    <span class="text-[10px] font-medium">Explore</span>
                </a>
                <a href="#" onclick="toggleModal(); return false;" class="tab-item text-gray-400 hover:text-emerald-600">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/></svg>
                    <span class="text-[10px] font-medium">Post</span>
                </a>
                <a href="#" class="tab-item text-gray-400 hover:text-emerald-600">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
                    <span class="text-[10px] font-medium">Profile</span>
                </a>
            </nav>
        </div>
    </div>

    <!-- Modal for Donation -->
    <div id="donateModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden justify-center items-end sm:items-center z-50 p-0 sm:p-4">
        <div class="bg-white rounded-t-3xl sm:rounded-2xl p-6 max-w-md w-full shadow-2xl animate-slide-up">
            <div class="w-12 h-1.5 bg-gray-300 rounded-full mx-auto mb-4 sm:hidden"></div>
            <h3 class="text-lg font-bold mb-4 text-gray-900">Post Surplus Food</h3>
            <form id="donationForm" onsubmit="handleDonate(event)" class="space-y-3">
                <input type="text" id="foodTitle" placeholder="Item Name (e.g., Fresh Apples)" required class="w-full p-3 bg-gray-50 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
                <select id="foodCategory" required class="w-full p-3 bg-gray-50 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
                    <option value="Produce">Produce</option>
                    <option value="Bakery">Bakery</option>
                    <option value="Prepared">Prepared Meal</option>
                </select>
                <input type="text" id="foodLocation" placeholder="Location / Neighborhood" required class="w-full p-3 bg-gray-50 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
                <input type="text" id="foodExpiry" placeholder="Best Before / Pickup Time" required class="w-full p-3 bg-gray-50 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
                
                <div class="flex gap-2 pt-2">
                    <button type="button" onclick="toggleModal()" class="w-1/2 py-3 bg-gray-100 font-semibold text-gray-600 rounded-xl text-sm active:scale-95 transition">Cancel</button>
                    <button type="submit" class="w-1/2 py-3 bg-emerald-600 font-semibold text-white rounded-xl text-sm shadow-md active:scale-95 transition">Submit</button>
                </div>
            </form>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
